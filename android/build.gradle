buildscript {
  ext.GpsTracker = [
    kotlinVersion: "2.0.21",
    roomVersion: "2.6.1",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop) && rootProject.ext.get(prop) != null) {
      return rootProject.ext.get(prop)
    }

    return GpsTracker[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlin-kapt"
apply plugin: "com.facebook.react"

android {
  namespace "com.gpstracker"

  compileSdk getExtOrDefault("compileSdkVersion") as int

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion") as int
    targetSdk getExtOrDefault("targetSdkVersion") as int
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.room:room-runtime:${getExtOrDefault('roomVersion')}"
  kapt "androidx.room:room-compiler:${getExtOrDefault('roomVersion')}"
}
